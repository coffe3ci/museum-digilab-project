# Bouwt de Android-APK van de museumapp in de cloud van GitHub (buildozer werkt alleen op Linux).
# Starten: automatisch bij een push naar main (als er iets in code/ verandert),
# of met de hand via het tabblad Actions -> "Android APK" -> "Run workflow".
# De APK staat daarna onderaan de run bij "Artifacts" (zip met de .apk erin).
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "code/**"
      - ".github/workflows/apk.yml"

jobs:
  bouwen:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Code ophalen
        uses: actions/checkout@v5

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Java 17 (nodig voor Android API 33)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Systeempakketten
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 libffi-dev libssl-dev lld

      - name: Buildozer installeren
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==3.0.11 setuptools

      # Android SDK/NDK en eerder gebouwde onderdelen bewaren: volgende builds gaan veel sneller
      - name: Buildozer-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            code/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('code/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: APK bouwen
        working-directory: code
        shell: bash
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      # Bij een fout: de laatste regels van het log als melding tonen (ook zichtbaar zonder in te loggen)
      - name: Foutmelding tonen
        if: failure()
        working-directory: code
        shell: bash
        run: |
          # kleurcodes weg, onschuldige Cython-hints overslaan
          sed -e 's/\x1b\[[0-9;]*m//g' build.log | grep -v "performance hint" > schoon.log
          # echte foutregels (compiler/Python), de laatste 40
          grep -nE "error:|Error:|Error compiling|Traceback|No such file|not found|undefined reference|FAILED" schoon.log \
            | grep -v "^.*DEBUG.*warning" | tail -n 40 > fouten.txt || true
          # de 80 regels vlak voor "Command failed" (daarna volgt alleen de omgevingslijst)
          regel=$(grep -n "Command failed" schoon.log | tail -n 1 | cut -d: -f1)
          if [ -n "$regel" ]; then head -n "$regel" schoon.log | tail -n 80 > voor_fout.txt; else tail -n 80 schoon.log > voor_fout.txt; fi
          for f in fouten.txt voor_fout.txt; do
            tekst=$(tr -d '\r' < "$f" | sed -e 's/%/%25/g' | cut -c1-300 | awk '{printf "%s%%0A", $0}')
            echo "::error title=$f::$tekst"
          done

      - name: APK uploaden
        uses: actions/upload-artifact@v4
        with:
          name: museumapp-apk
          path: code/bin/*.apk
          if-no-files-found: error
